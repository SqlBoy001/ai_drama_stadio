name: Verify
on:
  push:
    branches: [main, auto]
  pull_request:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: |
            backend-node/package-lock.json
            frontweb/package-lock.json
      - run: npm run setup
      - run: npm run verify
